[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "judgepack"
version = "0.1.0"
description = "AI briefing packs and triage for hackathon judges, evaluated honestly against real winners."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eileen Garip" }]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.20"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
judgepack = "judgepack.cli:main"

[tool.setuptools]
packages = ["judgepack"]

[tool.setuptools.package-data]
judgepack = ["demo_data/*.csv", "demo_data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
